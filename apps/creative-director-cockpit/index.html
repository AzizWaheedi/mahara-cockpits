<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      // Set the theme before the first paint, so the page never flashes the
      // other one. Same key and same class as the other cockpits.
      (function () {
        try {
          var s =
            localStorage.getItem("mahara-cockpit-theme") ||
            localStorage.getItem("theme");
          // Dark unless someone chose light: the brand's web default.
          var dark = s !== "light";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* a private window; the app sets it again once it loads */
        }
      })();
    </script>
    <title>Mahara Creative Cockpit</title>
    <!--
      What WhatsApp, Slack and iMessage show when a cockpit link is pasted:
      the Mahara Media wordmark on Deep Space.
    -->
    <meta property="og:site_name" content="Mahara Media" />
    <meta property="og:title" content="Creative Cockpit · Mahara" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://cockpit.maharamedia.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mahara Media" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#091333" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Daily cockpit for Mahara Media creative direction: brand DNA, scripts, editors, social calendar and winning creative." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

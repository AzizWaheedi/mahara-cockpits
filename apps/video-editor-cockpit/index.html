<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Set the theme before the first paint, so the page never flashes the
      // other one. Same key and same class as the other three cockpits.
      (function () {
        try {
          var s = localStorage.getItem("theme");
          var dark =
            s === "dark" ||
            (s !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* a private window; the app sets it again once it loads */
        }
      })();
    </script>
    <meta name="robots" content="noindex, nofollow" />
    <title>Editor desk · Mahara</title>
    <meta name="theme-color" content="#0b142b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

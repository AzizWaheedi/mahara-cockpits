<!--
  MAHARA MEDIA - CLIENT PROPOSAL (v3)
  ===================================
  A paged A4 document. Every page is composed: running header, live area on a
  two-column grid (margin column for labels and captions, main column for
  text held to a readable measure), footer with page number.

  DO NOT EDIT THIS FILE PER DEAL. The deal's content lives in the
  proposal's deal JSON (cockpit_sales_proposals.deal). The sales desk
  (hermes/sales-desk) builds it; by hand:

      python3 desk.py build <deal.json> --pdf

  The PDF is what goes to the client. The HTML is the source the generator
  fills; the block between @data-start and @data-end is replaced wholesale.

  PHOTOS
    Use OUR photos, never the client's. The client already knows their own
    work; what they are buying is our team, our floor and our reporting.
    Put images in hermes/sales-desk/assets/ and reference them as "assets/name.jpg".
    Any image left null renders a labelled placeholder, so an unfinished
    proposal is obvious and nobody sends one by accident. Team members without
    a photo render as an initials block, which is deliberate, not a gap.

  RULES BAKED IN
    - Money ships as visible placeholders (SAR X,XXX) until the closer
      replaces them with the figures actually quoted. Never invent a number.
    - Targets are stated as booked and attended, plus cost per booked and per
      attended. Never revenue, never a close rate we do not control.
    - Ad spend is always its own line, separate from the fee.
    - No emoji, no em dashes (brand voice).
    - If a page overflows its A4 height, a red OVERFLOW bar appears on it.
      Trim the content; do not ship a page with that bar.
-->

<style>
  /* ============================ Tokens ============================ */
  :root {
    --navy:    #091333;
    --navy-2:  #16244d;
    --teal:    #00CFC8;
    --teal-ink:#0a7a76;

    --ink:     #091333;
    --ink-2:   #333e5c;
    --ink-3:   #737d96;
    /* the one colour in the document that means money going out */
    --loss:    #9e2b25;
    --rule:    #c9d1e2;
    --rule-2:  #e4e9f3;
    --wash:    #f5f7fc;

    /* Geist carries no Arabic at all, so an Arabic document falls through to
       whatever the machine has. The Arabic faces sit AFTER Geist on purpose:
       fallback is per character, so Latin and every digit still render in
       Geist and only Arabic letters reach the next name on the list. */
    --sans: "Geist", "Plex Arabic", "SF Arabic", "Dubai", "Segoe UI", "Tahoma", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono: "Geist Mono", ui-monospace, "Cascadia Mono", "SF Mono", monospace;
    /* figures are set in the text face with tabular spacing, not in the mono
       face: mono numerals read as code, which is not what a proposal wants */
    --num: var(--sans);

    --r: 1.5mm;   /* corner radius on boxes that sit against text */
    --r-lg: 2.5mm;

    /* page geometry */
    --pw: 210mm;
    --ph: 297mm;
    --mx: 20mm;     /* side margin */
    --mt: 16mm;     /* top margin */
    --mb: 25mm;     /* bottom margin, leaves the footer its own air */
    --colside: 40mm;  /* margin column */
    --gutter: 8mm;
  }

  * { box-sizing: border-box; }

  html { background: #dfe4f0; }
  body {
    margin: 0;
    font-family: var(--sans);
    font-size: 10pt;
    line-height: 1.55;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
    font-variant-numeric: proportional-nums;
  }
  h1, h2, h3 { text-wrap: balance; }
  p, li { text-wrap: pretty; }

  /* ============================ Sheet ============================= */
  .sheet {
    position: relative;
    width: var(--pw);
    min-height: var(--ph);
    padding: var(--mt) var(--mx) var(--mb);
    background: #fff;
    counter-increment: sheet;
    page-break-after: always;
    break-after: page;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* One line at the foot of the page, set larger and quieter than the body.
     It carries the argument of the page in a sentence, and it stops a short
     page from looking unfinished. */
  .page-close {
    margin-top: auto; padding-top: 7mm;
    display: grid; grid-template-columns: var(--colside) 1fr; gap: var(--gutter);
    align-items: start;
  }
  .page-close .bar { height: 2pt; background: var(--teal); width: 14mm; border-radius: 1pt; margin-top: 3mm; }
  .page-close p {
    font-size: 13.5pt; line-height: 1.34; letter-spacing: -0.02em;
    color: var(--ink); max-width: 46ch; margin: 0; font-weight: 500;
  }
  .sheet:last-child { page-break-after: auto; break-after: auto; }

  /* running header */
  .rh {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10mm;
    font-family: var(--mono); font-size: 7.5pt; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--ink-3);
    padding-bottom: 3mm; border-bottom: 0.75pt solid var(--rule);
    margin-bottom: 10mm;
  }
  .rh .rh-r { color: var(--teal-ink); }

  /* footer */
  .rf {
    position: absolute; left: var(--mx); right: var(--mx); bottom: 9mm;
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--mono); font-size: 7.5pt; letter-spacing: 0.08em;
    color: var(--ink-3);
    padding-top: 3mm; border-top: 0.75pt solid var(--rule-2);
  }
  .rf .pn::after { content: counter(sheet) " / " var(--sheets); }
  .rf .pn { letter-spacing: 0.1em; }

  /* overflow guard */
  .of {
    display: none;
    position: absolute; left: 0; right: 0; bottom: 0;
    background: #b3251f; color: #fff; text-align: center;
    font-family: var(--mono); font-size: 8pt; letter-spacing: 0.1em; padding: 3px;
  }
  .sheet.over .of { display: block; }

  /* ============================ Grid ============================== */
  .row { display: grid; grid-template-columns: var(--colside) 1fr; gap: var(--gutter); }
  .row + .row, .map + .row, .row + .map { margin-top: 8mm; }
  .side {
    font-family: var(--mono); font-size: 7.5pt; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-3); padding-top: 1.5mm;
  }
  /* engineering corner mark, set beside the section title */
  .side .mark {
    display: inline-block; width: 5mm; height: 5mm;
    border-block-start: 1.2pt solid var(--teal); border-inline-start: 1.2pt solid var(--teal);
    border-start-start-radius: var(--r);
    margin-inline-end: 3mm; vertical-align: -1mm;
  }
  .side .no {
    display: inline-block; margin-bottom: 0; color: var(--teal-ink);
    font-family: var(--num); font-size: 15pt; font-weight: 600;
    letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
  }
  .side .lb { display: block; margin-top: 2mm; }

  /* ============================ People ============================= */
  .people { border-top: 1pt solid var(--navy); }
  .person {
    display: grid; grid-template-columns: 15mm 1fr; gap: 5mm; align-items: start;
    padding: 2.5mm 0; border-bottom: 0.5pt solid var(--rule-2);
  }
  .person .av { width: 15mm; height: 15mm; object-fit: cover; display: block; border-radius: var(--r); }
  .person .av.ini {
    background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center;
    font-family: var(--num); font-size: 11pt; font-weight: 600; letter-spacing: 0.04em;
    border-radius: var(--r);
  }
  .person h3 { font-size: 10pt; margin-bottom: 0.4mm; }
  .person .role {
    font-family: var(--mono); font-size: 7.5pt; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--teal-ink); display: block; margin-bottom: 0.8mm;
  }
  .person p { font-size: 8.5pt; margin: 0; }
  .main > *:first-child { margin-top: 0; }

  h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.015em; }
  h2 { font-size: 19pt; line-height: 1.15; letter-spacing: -0.025em; }
  h3 { font-size: 11pt; margin-bottom: 1.5mm; }
  p  { margin: 0 0 3.5mm; color: var(--ink-2); max-width: 68ch; }
  p:last-child { margin-bottom: 0; }
  .lede { font-size: 11.5pt; line-height: 1.45; color: var(--ink); }
  ul { margin: 0 0 3.5mm; padding-inline-start: 4.5mm; color: var(--ink-2); }
  li { margin-bottom: 1.6mm; }
  strong { font-weight: 600; color: var(--ink); }
  .mono { font-family: var(--mono); }
  .small { font-size: 8.5pt; color: var(--ink-3); }

  .sec-title { margin-bottom: 7mm; }
  .sec-title h2 { margin-bottom: 2.5mm; }

  /* ============================ Cover ============================= */
  .cover {
    padding: 0; background: var(--navy); color: #fff; display: flex; flex-direction: column;
  }
  .cover-band { position: relative; padding: var(--mt) var(--mx) 0; flex: 1; display: flex; flex-direction: column; }
  .cover-band > * { position: relative; }
  /* corner mark beside the title block, not behind it */
  .cover-mark {
    width: 14mm; height: 14mm;
    border-block-start: 1.5pt solid var(--teal); border-inline-start: 1.5pt solid var(--teal);
    border-top-left-radius: var(--r-lg);
    margin-bottom: 6mm;
  }
  .cover-head { display: flex; justify-content: space-between; align-items: flex-start; }
  .cover-head img { height: 8mm; }
  .cover-head .ref {
    font-family: var(--mono); font-size: 7.5pt; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(255,255,255,0.62); text-align: end; line-height: 1.9;
  }
  .cover-title { margin-top: 30mm; }
  .cover-kicker {
    font-family: var(--mono); font-size: 8pt; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--teal); margin: 0 0 6mm;
  }
  .cover h1 { font-size: 30pt; line-height: 1.1; letter-spacing: -0.03em; max-width: 20ch; }
  .cover .hair { height: 2pt; width: 26mm; background: var(--teal); border-radius: 1pt; margin: 7mm 0; }
  .cover-sub { font-size: 11pt; line-height: 1.5; color: rgba(255,255,255,0.78); max-width: 60ch; }
  .cover-meta {
    margin-top: auto; padding: 6mm 0 8mm;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6mm;
    border-top: 0.75pt solid rgba(255,255,255,0.22);
  }
  .cover-meta .k {
    display: block; font-family: var(--mono); font-size: 7pt; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 1.5mm;
  }
  .cover-meta .v { font-size: 9.5pt; color: #fff; line-height: 1.45; }
  .cover-meta .v.mono, .dc .v.mono { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: 0; }
  .cover-figure { height: 88mm; background: var(--navy-2); }
  .cover-figure { position: relative; }
  .cover-figure img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(0.85) contrast(1.05); }
  .cover-figure::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(9,19,51,0.55) 0%, rgba(9,19,51,0.10) 45%, rgba(9,19,51,0.35) 100%);
  }
  .cover-foot {
    padding: 4mm var(--mx); background: #050d24;
    font-family: var(--mono); font-size: 7pt; letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(255,255,255,0.45); display: flex; justify-content: space-between;
  }

  /* ============================ Contents =========================== */
  .toc { border-top: 1pt solid var(--navy); }
  .toc a, .toc div.row-toc {
    display: flex; align-items: baseline; gap: 4mm;
    padding: 3.2mm 0; border-bottom: 0.5pt solid var(--rule-2);
    color: var(--ink); text-decoration: none;
  }
  .toc .tno { font-family: var(--num); font-size: 9pt; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--teal-ink); width: 8mm; }
  .toc .tt { font-size: 10.5pt; }
  .toc .leader { flex: 1; border-bottom: 0.5pt dotted var(--rule); transform: translateY(-1mm); }
  .toc .tp { font-family: var(--num); font-size: 9.5pt; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink-3); }

  .dc { border-top: 1pt solid var(--navy); }
  .dc div { display: flex; gap: 6mm; padding: 2.6mm 0; border-bottom: 0.5pt solid var(--rule-2); }
  .dc .k {
    font-family: var(--mono); font-size: 7.5pt; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-3); width: 34mm; flex: 0 0 auto; padding-top: 0.7mm;
  }
  .dc .v { font-size: 9.5pt; }

  /* ============================ Exec summary ======================= */
  .es { border-top: 1pt solid var(--navy); }
  .es .row { padding: 4.5mm 0; border-bottom: 0.5pt solid var(--rule-2); margin: 0; }
  .es .side { color: var(--navy); font-weight: 600; }

  /* ============================ Findings list ====================== */
  .find { border-top: 1pt solid var(--navy); }
  .find li {
    list-style: none; display: grid; grid-template-columns: 9mm 1fr; gap: 3mm;
    padding: 3.2mm 0; margin: 0; border-bottom: 0.5pt solid var(--rule-2);
    color: var(--ink-2);
  }
  .find { padding-inline-start: 0; }
  .find .fn { font-family: var(--num); font-size: 9.5pt; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--teal-ink); padding-top: 0.2mm; }

  /* ============================ Exhibits =========================== */
  .exhibit { margin: 0 0 4mm; }
  .exhibit-head {
    display: flex; align-items: baseline; gap: 4mm;
    border-bottom: 1pt solid var(--navy); padding-bottom: 2mm; margin-bottom: 4mm;
  }
  .exhibit-head .en {
    font-family: var(--mono); font-size: 7.5pt; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--teal-ink);
  }
  .exhibit-head .et { font-size: 9.5pt; font-weight: 600; }
  .exhibit-note { font-size: 8.5pt; color: var(--ink-3); border-top: 0.5pt solid var(--rule-2); padding-top: 2.5mm; max-width: 78ch; }

  .fstage { display: grid; grid-template-columns: 32mm 1fr 16mm 24mm; gap: 3mm; align-items: center; margin-bottom: 2.2mm; }
  /* What fell out between this stage and the one above it. The loss is the
     argument of the page, so it is drawn, not left for the reader to subtract. */
  .fstage .lk {
    font-family: var(--num); font-size: 10pt; font-weight: 600; font-variant-numeric: tabular-nums;
    color: var(--loss); text-align: end; line-height: 1.1;
  }
  .fstage .lk small {
    display: block; font-family: var(--mono); font-size: 6.5pt; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-3); font-weight: 400;
  }
  .fstage .lab { font-size: 9.5pt; }
  .fstage .lab small { display: block; font-size: 8pt; color: var(--ink-3); }
  .fstage .track { background: var(--wash); height: 7mm; position: relative; border-radius: var(--r); }
  /* Nothing countable anywhere in the funnel: no track at all, and the label
     takes the room it would have used. Four empty grey tracks read as a broken
     chart, not as an absence of data. */
  .fstage.nofig { grid-template-columns: 1fr auto 24mm; }
  .fstage .bar { position: absolute; inset-block: 0; inset-inline: 0 auto; background: var(--navy); border-radius: var(--r); }
  .fstage .bar.acc { background: var(--teal-ink); }
  .fstage .val { font-family: var(--num); font-size: 11pt; font-weight: 600; font-variant-numeric: tabular-nums; text-align: end; }

  /* ============================ Tables ============================= */
  table { width: 100%; border-collapse: collapse; }
  caption { text-align: start; }
  th, td { text-align: start; padding-block: 2.2mm; padding-inline: 0 3mm; vertical-align: top; font-size: 9pt; line-height: 1.42; }
  thead th {
    font-family: var(--mono); font-size: 7.5pt; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 400; border-bottom: 1pt solid var(--navy); padding-bottom: 2mm;
  }
  tbody td { border-bottom: 0.5pt solid var(--rule-2); color: var(--ink-2); }
  thead th:first-child, tbody td:first-child { width: 24%; }
  thead th:nth-child(2), tbody td:nth-child(2) { width: 54%; }
  tbody td:first-child { color: var(--ink); font-weight: 600; }
  td.num, th.num { width: 22%; text-align: end; font-family: var(--num); font-variant-numeric: tabular-nums; color: var(--ink); padding-inline-end: 0; }
  tbody td.num { font-weight: 600; }
  .total {
    display: flex; justify-content: space-between; align-items: baseline;
    background: var(--navy); color: #fff; padding: 4mm 5mm; margin-top: 4mm; border-radius: var(--r-lg);
  }
  .total .k { font-family: var(--mono); font-size: 8pt; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.65); }
  .total .v { font-family: var(--num); font-size: 15pt; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; color: var(--teal); }

  /* ============================ Options ============================ */
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 7mm; }
  .opt { border-top: 2pt solid var(--rule); padding-top: 3.5mm; }
  .opt.rec { border-top-color: var(--teal); }
  .opt .tag {
    font-family: var(--mono); font-size: 7pt; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-3); display: block; margin-bottom: 2mm;
  }
  .opt.rec .tag { color: var(--teal-ink); }
  .opt h3 { font-size: 12pt; }
  .opt ul { padding-inline-start: 4mm; font-size: 9.5pt; }

  /* ============================ Steps ============================== */
  .steps { border-top: 1pt solid var(--navy); }
  .steps .st { display: grid; grid-template-columns: 9mm 1fr; gap: 3mm; padding: 4mm 0; border-bottom: 0.5pt solid var(--rule-2); }
  .steps .sn { font-family: var(--num); font-size: 12pt; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--teal-ink); }
  .steps p { font-size: 9.5pt; }

  /* ============================ Metrics ============================ */
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1pt solid var(--navy); }
  .metrics div { padding: 4mm 4mm 4mm 0; border-bottom: 0.5pt solid var(--rule-2); }
  .metrics .v { display: block; font-family: var(--num); font-size: 17pt; font-weight: 600; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
  .metrics .k { display: block; font-size: 8.5pt; color: var(--ink-3); margin-top: 1mm; }

  /* ============================ Photos ============================= */
  .shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4mm; }
  /* Photographs are harmonised rather than left raw: a touch of desaturation
     and a navy tint so client-supplied images of mixed quality still read as
     one set. Set body class "photo-raw" to leave them untouched. */
  .shot { position: relative; }
  .shot img {
    width: 100%; height: 32mm; object-fit: cover; display: block; border-radius: var(--r);
    filter: saturate(0.82) contrast(1.04);
  }
  .shot::after {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 32mm;
    border-radius: var(--r); pointer-events: none;
    background: linear-gradient(180deg, rgba(9,19,51,0.10), rgba(9,19,51,0.02));
  }
  .shot:has(.ph)::after { content: none; }
  body.photo-raw .shot img { filter: none; }
  body.photo-raw .shot::after { content: none; }
  .shot .cap { font-family: var(--mono); font-size: 7pt; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); padding-top: 1.6mm; }
  .ph {
    height: 32mm; border: 0.75pt dashed var(--rule); background: var(--wash); border-radius: var(--r);
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 4mm;
    font-family: var(--mono); font-size: 7pt; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3);
  }
  .cover-figure .ph { height: 100%; border: none; background: var(--navy-2); color: rgba(255,255,255,0.5); }

  /* ============================ Cases ============================== */
  .cases { border-top: 1pt solid var(--navy); }
  .case { padding: 3mm 0; border-bottom: 0.5pt solid var(--rule-2); }
  .case h3 { margin-bottom: 0.8mm; font-size: 10.5pt; }
  .case p { font-size: 9.5pt; }
  .case .res { font-family: var(--mono); font-size: 9pt; color: var(--teal-ink); display: block; margin-top: 1.5mm; }
  /* Splits the pattern into the two situations a cold reader can be in, so he
     sorts himself into one before he reads a word of the detail. */
  .cgroup { font-family: var(--mono); font-size: 7.5pt; letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--teal-ink); padding: 3.5mm 0 1.5mm; border-bottom: 0.5pt solid var(--rule-2); }
  .cases > .cgroup:first-child { padding-top: 1mm; }

  /* ============================ Problem to fix map ================= */
  .map { border-top: 1pt solid var(--navy); }
  /* The problem sits in the margin column and the fix runs at the same
     measure as every other paragraph in the document. Splitting the main
     column in two halved the measure and left four words to a line. */
  .map .m {
    display: grid; grid-template-columns: var(--colside) 1fr; gap: var(--gutter);
    padding: 3.2mm 0; border-bottom: 0.5pt solid var(--rule-2);
  }
  .map .lhs h3 { font-size: 9.5pt; margin-bottom: 0.8mm; line-height: 1.25; }
  .map .lhs p { font-size: 8pt; color: var(--ink-3); margin: 0; line-height: 1.3; }
  /* A hairline rather than an arrow: it starts and ends with the text, so
     it cannot sit half a line out like a glyph does. */
  .map .rhs {
    position: relative; padding-inline-start: 5mm;
    border-inline-start: 1.2pt solid var(--teal);
  }
  .map .rhs p { font-size: 9.5pt; margin: 0; color: var(--ink); }

  /* ============================ Headline numbers =================== */
  .big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6mm; margin-bottom: 5mm; }
  .big div { border-top: 2pt solid var(--navy); padding-top: 3mm; }
  .big .v {
    display: block; font-family: var(--num); font-size: 22pt; font-weight: 600;
    letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1.05;
  }
  .big .k { display: block; font-size: 8.5pt; color: var(--ink-3); margin-top: 1.5mm; }
  .big.accent div { border-top-color: var(--teal); }
  .big.accent .v { color: var(--teal-ink); }

  .verdict {
    background: var(--navy); color: #fff; border-radius: var(--r-lg);
    padding: 6mm 7mm; margin-top: 5mm;
  }
  .verdict .k {
    font-family: var(--mono); font-size: 7.5pt; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(255,255,255,0.6); display: block; margin-bottom: 2mm;
  }
  .verdict p { color: #fff; font-size: 11pt; margin: 0; max-width: none; }
  .verdict strong { color: var(--teal); }

  /* ====================== The general variant ======================
     Used when the call never produced the client's own figures. The gap
     page carries what they said instead of what they earn, and the cost
     page is replaced by arithmetic performed entirely on our own fee. */

  /* Every cell is arithmetic on our own fee, so the page asserts nothing
     about the client that the client did not say. The reader finds his
     own row, which persuades better than being told which one it is. */
  .betab { width: 100%; border-collapse: collapse; }
  .betab th, .betab td { padding-block: 2.6mm; font-size: 9.5pt; text-align: end; }
  .betab thead th {
    font-family: var(--mono); font-size: 7.5pt; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 400; border-bottom: 1pt solid var(--navy); padding-bottom: 2mm;
  }
  .betab thead th:first-child, .betab tbody td:first-child { text-align: start; width: 40%; }
  .betab tbody td { border-bottom: 0.5pt solid var(--rule-2); font-family: var(--num);
                    font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
  .betab tbody td:first-child { font-weight: 500; color: var(--ink-2); }
  .betab tbody tr.under td { color: var(--teal-ink); }

  /* Showing the system running beats describing it, by a wide margin in
     every study of proposals anyone has published. The code is generated
     at build time from media.url, so nothing here reaches the network. */
  .media { display: flex; gap: 5mm; align-items: center;
           border-top: 1pt solid var(--navy); padding-top: 4mm; margin-top: 4mm; }
  .media .qr { flex: 0 0 24mm; width: 24mm; height: 24mm; padding: 1.5mm;
               background: #fff; border: 0.5pt solid var(--rule-2); border-radius: var(--r-lg); }
  .media .qr img { display: block; width: 100%; height: 100%; }
  .media .qr.empty { display: flex; align-items: center; justify-content: center; text-align: center;
                     font-family: var(--mono); font-size: 6.5pt; line-height: 1.3; color: var(--ink-3); }
  .media h4 { margin: 0 0 1.5mm; font-size: 10.5pt; }
  .media p { margin: 0; font-size: 9pt; color: var(--ink-2); max-width: 60ch; }
  .media .url { display: block; font-family: var(--mono); font-size: 7.5pt;
                color: var(--ink-3); margin-top: 2mm; word-break: break-all; }

  /* A cold document ends in a conversation, not a signature. */
  .cta { background: var(--navy); color: #fff; padding: 5mm 6mm; border-radius: var(--r-lg); }
  .cta h4 { margin: 0 0 2mm; font-size: 13pt; color: #fff; }
  .cta p { margin: 0; font-size: 10pt; color: rgba(255,255,255,0.82); max-width: 62ch; }
  .cta .act { display: block; margin-top: 3.5mm; padding-top: 3mm;
              border-top: 0.5pt solid rgba(255,255,255,0.22);
              font-family: var(--mono); font-size: 8.5pt; letter-spacing: 0.06em; color: var(--teal); }

  /* ======================= Driver tree ==============================
     The client's goal, the drivers that reach it, and the sub-drivers
     under each. Drawn as a bracket rather than written as prose: the
     reader walks the reasoning themselves and arrives at the conclusion
     on their own, which is worth more than being told it. Two or three
     branches, never more; the branches must not overlap and together
     must cover the whole goal. */
  /* Read top down, as an org chart is read: a boxed root, a spine across
     the drivers, a rail down each driver into its sub-drivers. Every level
     is a box and every relationship is a drawn line, so the structure is
     visible before a word of it is read. Nodes are lettered A, A1, A2. */
  /* Geometry, all of it derived from these five figures. Nothing in the
     drawing is a typed-in offset: the spine spans exactly the centres of
     the outer drivers, the rail sits exactly under the badge axis, and
     the elbows meet the vertical centre of each node number. */
  .tree {
    display: block;
    --link: #9aa6c0;
    --tree-gap: 10mm;   /* between driver columns */
    --drop: 11mm;       /* vertical run between levels */
    --sub-gap: 6mm;     /* between sub-drivers */
    --pad: 5.5mm;       /* driver box padding */
    --badge: 5.4mm;     /* node number, both levels */
    --bw: 0.75pt;       /* box border, which offsets the badge inside it */
    --rail: calc(var(--bw) + var(--pad) + var(--badge) / 2);  /* rail x, under the badge */
    --elbow: calc(var(--badge) / 2);                          /* elbow y, badge centre */
  }
  .tree .goal {
    background: var(--navy); color: #fff; border-radius: var(--r-lg); padding: 7mm 8mm;
    position: relative; width: 128mm; margin: 0 auto;
  }
  .tree .goal::after {
    content: ""; position: absolute; left: 50%; bottom: calc(-1 * var(--drop)); height: var(--drop);
    border-inline-start: 0.75pt solid var(--link);
  }
  .tree .goal .lbl {
    display: block; font-family: var(--mono); font-size: 7pt; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(255,255,255,0.55); margin-bottom: 2mm;
  }
  .tree .goal h3 { color: #fff; font-size: 15pt; line-height: 1.22; margin: 0 0 2mm; }
  .tree .goal p { color: rgba(255,255,255,0.72); font-size: 9pt; line-height: 1.4; margin: 0; max-width: none; }

  /* The spine runs between the centres of the outer drivers only, so it
     stops at the boxes it connects instead of running into the margin. */
  .tree .branches {
    display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); gap: var(--tree-gap);
    margin-top: var(--drop); padding-top: var(--drop); position: relative;
  }
  /* Half a column, so the spine starts and ends on the drop lines rather
     than a guessed percentage. Column width is (100% - (n-1) gaps) / n. */
  .tree .branches::before {
    content: ""; position: absolute; top: 0;
    left: calc((100% - (var(--n, 2) - 1) * var(--tree-gap)) / (2 * var(--n, 2)));
    right: calc((100% - (var(--n, 2) - 1) * var(--tree-gap)) / (2 * var(--n, 2)));
    border-top: 0.75pt solid var(--link);
  }
  .branch { position: relative; }
  .branch::before {
    content: ""; position: absolute; left: 50%; top: calc(-1 * var(--drop)); height: var(--drop);
    border-inline-start: 0.75pt solid var(--link);
  }
  .branch .drv {
    border: var(--bw) solid var(--rule); border-top: 2.5pt solid var(--navy);
    border-radius: var(--r); padding: 5mm var(--pad); background: #fff;
  }
  .branch .drv .dn {
    display: flex; align-items: center; justify-content: center;
    width: var(--badge); height: var(--badge); border-radius: 50%;
    background: var(--navy); color: #fff;
    font-family: var(--num); font-size: 8pt; font-weight: 600; margin-bottom: 2mm;
  }
  .branch .drv h3 { font-size: 12.5pt; line-height: 1.22; margin-bottom: 1.4mm; }
  .branch .drv p { font-size: 9pt; color: var(--ink-3); line-height: 1.35; margin: 0; }
  /* The rail is drawn segment by segment, one per sub-driver, each running
     from the elbow above it down to its own. It therefore stops dead at the
     last elbow instead of trailing past the final node. */
  .branch .subs {
    display: grid; gap: var(--sub-gap); position: relative;
    margin-block-start: var(--drop); margin-inline-start: var(--rail); padding-inline-start: 8mm;
  }
  .branch .sub { display: grid; grid-template-columns: var(--badge) 1fr; gap: 3.5mm; position: relative; }
  .branch .sub::before {
    content: ""; position: absolute; inset-inline-start: -8mm; top: var(--elbow); width: 8mm;
    border-top: 0.75pt solid var(--link);
  }
  .branch .sub::after {
    content: ""; position: absolute; inset-inline-start: -8mm;
    top: calc(-1 * var(--sub-gap)); height: calc(var(--sub-gap) + var(--elbow));
    border-inline-start: 0.75pt solid var(--link);
  }
  .branch .sub:first-child::after {
    top: calc(-1 * var(--drop)); height: calc(var(--drop) + var(--elbow));
  }
  .branch .sub .sn {
    display: flex; align-items: center; justify-content: center;
    width: var(--badge); height: var(--badge);
    font-family: var(--num); font-size: 7.5pt; font-weight: 600; color: var(--teal-ink);
    border: 0.75pt solid var(--teal); border-radius: var(--r);
  }
  .branch .sub h4 { margin: 0 0 0.8mm; font-size: 10.5pt; font-weight: 600; letter-spacing: -0.01em; }
  .branch .sub p { margin: 0; font-size: 9pt; color: var(--ink-2); line-height: 1.4; }

  /* ======================= Cost stack ===============================
     What the gap costs in money, one layer per row: cash going out,
     growth not happening, and the load on the people. The bar shows
     each layer against the largest one, so the shape of the problem
     is visible before any of the figures are read. */
  .stack { border-top: 1pt solid var(--navy); }
  .lay {
    display: grid; grid-template-columns: 7mm 1fr 32mm; gap: 4mm;
    padding: 3mm 0; border-bottom: 0.5pt solid var(--rule-2); align-items: start;
  }
  .lay .ln {
    font-family: var(--num); font-size: 9.5pt; font-weight: 600;
    font-variant-numeric: tabular-nums; color: var(--teal-ink);
  }
  .lay h3 { font-size: 10pt; margin-bottom: 0.6mm; }
  .lay p { font-size: 8.5pt; color: var(--ink-3); line-height: 1.35; margin: 0 0 2mm; }
  .lay .track { background: var(--wash); height: 2.6mm; border-radius: 1pt; position: relative; }
  .lay .track .bar { position: absolute; inset-block: 0; inset-inline: 0 auto; background: var(--loss); border-radius: 1pt; opacity: 0.85; }
  .lay .amt { text-align: end; }
  .lay .amt .m {
    display: block; font-family: var(--num); font-size: 12pt; font-weight: 600;
    letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
  }
  .lay .amt .y {
    display: block; font-family: var(--num); font-size: 9pt; font-variant-numeric: tabular-nums;
    color: var(--ink-3); margin-top: 1.2mm;
  }
  .lay .amt small {
    display: block; font-family: var(--mono); font-size: 6.5pt; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .lay.nil .amt .m { font-size: 9pt; font-weight: 500; color: var(--ink-3); }

  /* ======================= Fraction bar =============================
     What the whole engagement costs, drawn inside what the gap costs
     over a year. The price is never argued in the abstract. */
  .frac { margin-top: 6mm; }
  .frac .fbar { position: relative; height: 9mm; background: var(--wash); border-radius: var(--r); overflow: hidden; }
  /* Physical inset, missed in the right-to-left pass: this filled from the
     left edge, so in Arabic the fee ran the opposite way to every other bar. */
  .frac .fbar .fill { position: absolute; inset-block: 0; inset-inline: 0 auto; background: var(--navy); }
  .frac .fends {
    display: flex; justify-content: space-between; gap: 6mm; margin-top: 1.8mm;
    font-family: var(--mono); font-size: 7.5pt; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .frac .fends .l { color: var(--navy); }

  /* ======================= Process chain ============================ */
  .chain { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4mm; border-top: 1pt solid var(--navy); padding-top: 2.5mm; }
  .chain .node .cn {
    font-family: var(--num); font-size: 9pt; font-weight: 600;
    font-variant-numeric: tabular-nums; color: var(--teal-ink);
  }
  .chain .node h4 { margin: 0.8mm 0 0.5mm; font-size: 9pt; font-weight: 600; line-height: 1.2; }
  .chain .node p { margin: 0; font-size: 7.5pt; color: var(--ink-3); line-height: 1.3; }

  /* ======================= Timeline ================================= */
  .tl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5mm; position: relative; }
  .tl::before { content: ""; position: absolute; left: 0; right: 0; top: 1.4mm; border-top: 0.75pt solid var(--rule); }
  .tl .stop { position: relative; padding-top: 6mm; }
  .tl .stop::before {
    content: ""; position: absolute; left: 0; top: 0; width: 2.8mm; height: 2.8mm;
    background: var(--teal); border-radius: 50%;
  }
  .tl .when {
    display: block; font-family: var(--mono); font-size: 7pt; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--teal-ink); margin-bottom: 1mm;
  }
  .tl h4 { margin: 0 0 0.6mm; font-size: 9.5pt; font-weight: 600; }
  .tl p { margin: 0; font-size: 8.5pt; color: var(--ink-3); line-height: 1.35; }

  /* ======================= Proof strip ============================== */
  .proof { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6mm; border-top: 1pt solid var(--navy); padding-top: 2.5mm; }
  .proof .v {
    display: block; font-family: var(--num); font-size: 13pt; font-weight: 600;
    letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: var(--teal-ink);
  }
  .proof p { margin: 0.8mm 0 0; font-size: 8pt; line-height: 1.3; color: var(--ink-2); }
  .proof .src {
    display: block; font-family: var(--mono); font-size: 6.5pt; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-3); margin-top: 1mm;
  }

  .deposit {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8mm;
    border: 1.5pt solid var(--teal); border-radius: var(--r-lg);
    padding: 6mm 7mm; margin-bottom: 6mm;
  }
  .deposit .k { font-size: 10pt; color: var(--ink-2); }
  .deposit .v {
    font-family: var(--num); font-size: 24pt; font-weight: 600;
    letter-spacing: -0.03em; color: var(--ink); white-space: nowrap;
  }

  /* ============================ Signature ========================== */
  .sig { display: grid; grid-template-columns: 1fr 1fr; gap: 10mm; margin-top: 8mm; }
  .sig .box { border-top: 1pt solid var(--navy); padding-top: 3mm; }
  .sig .who { font-family: var(--mono); font-size: 7.5pt; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
  .sig .line { border-bottom: 0.75pt solid var(--rule); height: 16mm; margin-top: 6mm; }
  .sig .cap { font-size: 8pt; color: var(--ink-3); margin-top: 1.5mm; }

  /* ============================ Q and A ============================ */
  .qa { border-top: 1pt solid var(--navy); }
  .qa .q { padding: 3.4mm 0; border-bottom: 0.5pt solid var(--rule-2); }
  .qa .q h3 { font-size: 9.5pt; margin-bottom: 1mm; }
  .qa .q p { font-size: 9pt; margin: 0; }

  /* ============================ Editor ============================= */
  /* Screen-only content editor. Never printed, never part of the PDF. */
  #ed-open {
    position: fixed; left: 16px; bottom: 16px; z-index: 50;
    font-family: var(--sans); font-size: 13px; font-weight: 600;
    background: var(--navy); color: #fff; border: none; border-radius: 6px;
    padding: 10px 16px; cursor: pointer; box-shadow: 0 4px 16px rgba(9,19,51,.25);
  }
  /* One number decides the panel and the room left for the page beside it.
     An A4 sheet is 210mm, about 794px, so the panel gives way on a narrow
     screen rather than pushing the document off the side. */
  :root { --ed-w: 460px; }
  @media (max-width: 1320px) { :root { --ed-w: 400px; } }
  @media (max-width: 1120px) { :root { --ed-w: 360px; } }
  #ed {
    position: fixed; top: 0; right: 0; bottom: 0; width: var(--ed-w); z-index: 60;
    background: #fff; border-left: 1px solid var(--rule);
    box-shadow: -8px 0 32px rgba(9,19,51,.14);
    display: none; flex-direction: column; font-family: var(--sans);
  }
  #ed.on { display: flex; }
  body.ed-on { padding-right: var(--ed-w); }
  #ed header {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 16px 20px 14px; border-bottom: 1px solid var(--rule-2);
  }
  #ed header h4 { margin: 0 auto 0 0; font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; }
  #ed button.act {
    font-family: var(--sans); font-size: 12px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--rule); background: #fff; color: var(--ink);
    border-radius: 6px; padding: 7px 11px; transition: transform 90ms ease-out;
  }
  #ed button.act:active { transform: scale(.96); }
  #ed button.act.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  #ed .body { overflow-y: auto; scrollbar-gutter: stable; padding: 4px 20px 44px; }
  #ed details { border-bottom: 1px solid var(--rule-2); }
  #ed details > summary {
    cursor: pointer; padding: 12px 0; font-size: 13px; font-weight: 600;
    list-style: none; display: flex; justify-content: space-between; gap: 8px;
  }
  #ed details > summary::-webkit-details-marker { display: none; }
  #ed details > summary::after { content: "+"; color: var(--ink-3); }
  #ed details[open] > summary::after { content: "-"; }
  #ed details details { border: none; margin-left: 10px; }
  #ed .f { padding: 7px 0 15px; }
  #ed .f label {
    display: block; font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--ink-3); margin-bottom: 6px;
  }
  #ed input, #ed textarea {
    width: 100%; font-family: var(--sans); font-size: 13px; line-height: 1.5; color: var(--ink);
    border: 1px solid var(--rule); border-radius: 6px; padding: 9px 11px; background: #fff;
    resize: vertical;
  }
  #ed input:focus, #ed textarea:focus { outline: 2px solid var(--teal); outline-offset: -1px; }
  #ed .item { border-left: 2px solid var(--rule); padding-left: 12px; margin: 10px 0 16px; }
  #ed .item-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: var(--ink-3); margin-bottom: 4px;
  }
  #ed .mini {
    font-size: 11px; cursor: pointer; border: none; background: none;
    color: #b3251f; padding: 4px 6px;
  }
  #ed .add {
    font-family: var(--sans); font-size: 12px; cursor: pointer; border: 1px dashed var(--rule);
    background: #fff; color: var(--ink-2); border-radius: 6px; padding: 7px 12px; margin-bottom: 12px;
    transition: transform 90ms ease-out;
  }
  #ed .add:active { transform: scale(.97); }
  #ed .row-inline { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
  #ed .row-inline textarea { flex: 1; }
  #ed .hint { font-size: 11.5px; color: var(--ink-3); padding: 10px 0 0; }
  #ed .pick { display: flex; gap: 8px; align-items: center; }
  #ed .pick input[type=file] { font-size: 11px; border: none; padding: 0; }
  #ed .thumb {
    width: 46px; height: 34px; object-fit: cover; border-radius: 4px;
    border: 1px solid var(--rule); flex: 0 0 auto;
  }
  #ed .thumb.empty {
    background: var(--wash); display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: var(--ink-3);
  }
  #ed .steps-note {
    background: var(--wash); border: 1px solid var(--rule-2); border-radius: 6px;
    padding: 10px 12px; margin: 10px 0 4px; font-size: 11.5px; color: var(--ink-2); line-height: 1.5;
  }
  #ed .steps-note b { color: var(--ink); }

  /* -------- Page navigator ---------------------------------------
     The panel is organised as the document is: one group per sheet, in
     the order they print. Page 4 in the panel is page 4 in the PDF, and
     the group is named with the same word the page carries in its own
     running header, so there is nothing to translate between the two. */
  /* The chip row is its own band between the header and the scrolling body,
     not a sticky strip inside it. Two reasons, both measured: inside the body
     it sat 1px from the left edge and 15px from the right, because the
     scrollbar ate the inset; and its bottom fade landed on top of the first
     heading, 6px below. Out here it spans the full panel and owns its space. */
  #ed nav {
    flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px;
    padding: 12px 20px 14px; border-bottom: 1px solid var(--rule-2);
    background: var(--wash);
  }
  #ed nav button {
    cursor: pointer; font-family: var(--sans); white-space: nowrap;
    font-size: 11.5px; font-weight: 600; color: var(--ink-2);
    border: 1px solid var(--rule); background: #fff;
    border-radius: 999px; padding: 6px 12px; transition: transform 90ms ease-out;
  }
  #ed nav button:active { transform: scale(.95); }
  #ed nav button.here { background: var(--navy); border-color: var(--navy); color: #fff; }
  #ed nav button i {
    font-style: normal; font-family: var(--mono); font-size: 10px;
    opacity: .5; margin-right: 6px;
  }

  #ed .grp { border-top: 1px solid var(--rule-2); padding: 4px 0 14px; }
  #ed .grp:first-of-type { border-top: none; }
  #ed .grp > h5 {
    display: flex; align-items: center; gap: 9px; margin: 20px 0 10px;
    font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink);
  }
  #ed .grp > h5 .pg {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; color: var(--ink-3);
    border: 1px solid var(--rule); border-radius: 4px; padding: 2px 6px;
  }
  #ed .grp > h5 .go {
    margin-left: auto; font-family: var(--sans); font-size: 11.5px; font-weight: 600;
    cursor: pointer; border: none; background: none; color: var(--teal-ink); padding: 3px 0;
  }
  #ed .grp.off > h5 { opacity: .55; }
  #ed .opt { display: flex; flex-wrap: wrap; gap: 7px; padding: 4px 0 6px; }
  #ed .opt .add { margin: 0; }
  #ed .grp-note { font-size: 11.5px; line-height: 1.5; color: var(--ink-3); padding: 0 0 10px; }

  /* -------- Find a field ------------------------------------------
     The panel used to be able to edit only the keys a deal file already
     had. On a blind proposal that hid fifteen of them, the whole start
     page among them, with no button anywhere that would bring them back:
     asked for the plan, the panel had nothing to show and no way to say
     so. Every field the document can render is now listed whether the
     file carries it or not, which makes the list long enough to need
     searching. A closer knows what he wants to change by the words on the
     page, not by the key it is stored under, so each field carries the
     words he might type as well as its own name. */
  #ed .find {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 12px 20px; border-bottom: 1px solid var(--rule-2);
  }
  #ed .find input {
    flex: 1; font-family: var(--sans); font-size: 13px; color: var(--ink);
    border: 1px solid var(--rule); border-radius: 999px; padding: 8px 13px; background: #fff;
  }
  #ed .find input:focus { outline: 2px solid var(--teal); outline-offset: -1px; }
  #ed .find .clr {
    font-size: 12px; cursor: pointer; border: none; background: none;
    color: var(--ink-3); padding: 4px 2px;
  }
  #ed .nores { font-size: 12.5px; color: var(--ink-3); padding: 18px 0; line-height: 1.6; }

  /* Fields the deal file leaves out. Not an "optional" list kept by hand
     beside the real one — everything absent, listed, one click from real. */
  #ed .miss { padding: 2px 0 6px; }
  #ed .miss .cap {
    font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ink-3); margin: 6px 0 7px;
  }
  #ed .miss .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  #ed .miss .add { margin: 0; }

  /* A field arrived at from the page rather than from the list. */
  #ed .f.hit > label, #ed details.hit > summary { color: var(--teal-ink); }
  #ed .f.hit input, #ed .f.hit textarea { border-color: var(--teal); }

  /* -------- "Edit this page" -------------------------------------
     The shortest path from seeing the thing to changing it: no name to
     know, no group to find. Screen only, and only while the panel is open,
     so it can never reach a PDF. */
  @media screen {
    .sheet { position: relative; }
    .edit-here {
      position: absolute; top: 8px; right: 8px; z-index: 6; display: none;
      font-family: var(--sans); font-size: 11.5px; font-weight: 600; cursor: pointer;
      background: var(--navy); color: #fff; border: none; border-radius: 999px;
      padding: 6px 12px; box-shadow: 0 2px 10px rgba(9,19,51,.22);
    }
    body.ed-on .sheet:hover .edit-here { display: block; }
    body.ed-on .sheet:focus-within .edit-here { display: block; }
  }
  @media print { .edit-here { display: none !important; } }

  /* Answering "which page am I editing" from the document side. */
  @media screen {
    .sheet { transition: outline-color 260ms ease-out; outline: 2px solid transparent; outline-offset: 4px; }
    .sheet.flash { outline-color: var(--teal); }
  }
  @media (prefers-reduced-motion: reduce) {
    #ed nav button, .sheet { transition: none; }
  }
  @media (prefers-reduced-transparency: reduce) {
    #ed nav { background: #fff; backdrop-filter: none; }
  }
  @media print { #ed, #ed-open { display: none !important; } body.ed-on { padding-right: 0; } }

  /* ============================ Screen ============================= */
  @media screen {
    body { padding: 24px 12px 40px; }
    .sheet { margin: 0 auto 16px; box-shadow: 0 1px 3px rgba(9,19,51,.14), 0 12px 32px rgba(9,19,51,.10); }
  }

  /* ============================ Print ============================== */
  @page { size: A4; margin: 0; }
  @media print {
    html, body { background: #fff; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    /* 296mm, not 297: Chrome rounds mm to device pixels and a sheet sized to the
       exact page height spills a blank page after every sheet. The 1mm sits
       inside the 16mm bottom margin, so nothing is lost. */

    beVolTable: "\u0627\u0644\u0627\u0633\u062a\u062b\u0645\u0627\u0631 \u0645\u0642\u0627\u0628\u0644 \u0645\u0627 \u062a\u0636\u064a\u0641\u0647 \u0627\u0644\u0645\u062f\u0629",
    beWholeThing: "\u0625\u062c\u0645\u0627\u0644\u064a \u0627\u0644\u0627\u0633\u062a\u062b\u0645\u0627\u0631",
    beCoversIf: "\u0645\u0634\u0631\u0648\u0639 \u0648\u0627\u062d\u062f \u064a\u063a\u0637\u064a\u0647 \u0625\u0630\u0627 \u0628\u0642\u064a \u0644\u0643 \u0623\u0643\u062b\u0631 \u0645\u0646",
    beMarginTable: "\u0643\u0645 \u064a\u062c\u0628 \u0623\u0646 \u064a\u062a\u0631\u0643 \u0644\u0643 \u0645\u0634\u0631\u0648\u0639 \u0648\u0627\u062d\u062f",
    beOneJob: "\u0645\u0634\u0631\u0648\u0639 \u0648\u0627\u062d\u062f \u064a\u063a\u0637\u064a \u0627\u0644\u0643\u0644\u0641\u0629 \u0639\u0646\u062f",
    beThreshold: "\u0643\u0645 \u064a\u062c\u0628 \u0623\u0646 \u062a\u0633\u0627\u0648\u064a \u0642\u064a\u0645\u0629 \u0645\u0634\u0631\u0648\u0639 \u0648\u0627\u062d\u062f",
  }
};
let L = STR.en;

function renderDoc() {
/* Language and reading direction come from the deal file, so the same
   template sets an Arabic proposal right-to-left without a second build.
   Every physical margin, padding, border and alignment in the document
   stylesheet is a logical property, so the whole page mirrors from this
   one attribute — including the driver tree's connectors and the bars on
   the funnel and cost pages. */
L = STR[P.lang === "ar" ? "ar" : "en"];
document.documentElement.lang = P.lang || "en";
document.documentElement.dir = P.dir || (P.lang === "ar" ? "rtl" : "ltr");

sheets = []; exhibitNo = 0; secN = 0;

/* What the gap costs over a year, computed once on the cost page and read
   again on the investment page, where the fee is drawn as a fraction of it. */
let gapAnnual = 0;
let gapCur = "";
let engagementLocal = 0;

/* ---------------- Cover ---------------- */
sheets.push(`
<section class="sheet cover">
  <div class="cover-band">
    <div class="cover-head">
      ${P.logo ? `<img src="${esc(P.logo)}" alt="Mahara Media">` : `<span class="mono">MAHARA MEDIA</span>`}
      <div class="ref">${esc(P.doc_type)}<br>${esc(P.reference)}<br>${esc(P.date)}</div>
    </div>
    <div class="cover-title">
      <div class="cover-mark"></div>
      <div class="cover-kicker">${esc(P.kicker || "Proposal")}</div>
      <h1>${esc(P.headline)}</h1>
    </div>
    <div class="hair"></div>
    <p class="cover-sub">${esc(P.subhead)}</p>
    <div class="cover-meta">
      <div><span class="k">${L.preparedFor}</span><span class="v">${esc(P.client_contact)}, ${esc(P.client_role)}<br>${esc(P.client_company)}, ${esc(P.city)}</span></div>
      <div><span class="k">${L.preparedBy}</span><span class="v">${esc(P.prepared_by)}<br>${esc(P.prepared_by_role || "")}<br>${esc(P.company_line)}</span></div>
      <div><span class="k">${L.validUntil}</span><span class="v mono">${esc(P.valid_until)}</span></div>
    </div>
  </div>
  ${P.cover_image ? `<div class="cover-figure"><img src="${esc(P.cover_image)}" alt=""></div>` : ""}
  <div class="cover-foot">
    <span>${esc(P.company_contact)}</span>
    <span>${esc(P.confidentiality)}</span>
  </div>
</section>`);

/* ---------------- 01 The gap ---------------- */
if (P.funnel || (P.gap_points && P.gap_points.length)
    || (P.pattern && P.pattern.length)
    || (P.pattern_groups && P.pattern_groups.length)) {
  let fig = "";
  if (P.funnel && P.funnel.stages) {
    const max = Math.max(...P.funnel.stages.map(x => Number(x.value) || 0)) || 1;
    /* If nothing anywhere in the funnel is countable, the bar column carries
       no information at all — it draws four empty grey tracks, which reads as
       a broken chart rather than as an absence of data. The cost page already
       handles this by omitting the track; the funnel now does the same and
       falls back to a labelled list. */
    const anyValue = P.funnel.stages.some(x => (Number(x.value) || 0) > 0);
    const bars = P.funnel.stages.map((x, i) => {
      /* A stage with nothing in it draws no bar at all. A minimum-width bar
         would read as a small number rather than as an absence. */
      const v = Number(x.value) || 0;
      const w = v === 0 ? 0 : Math.max(6, (v / max) * 100);
      const last = i === P.funnel.stages.length - 1;
      /* the drop from the stage above, drawn so the reader never has to
         subtract two numbers to see where the money goes */
      const prev = i > 0 ? Number(P.funnel.stages[i - 1].value) || 0 : 0;
      const drop = i > 0 ? prev - (Number(x.value) || 0) : 0;
      const pct = prev > 0 ? Math.round(drop / prev * 100) : 0;
      return `<div class="fstage${anyValue ? "" : " nofig"}">
        <div class="lab">${esc(x.label)}<small>${esc(x.note)}</small></div>
        ${anyValue ? `<div class="track"><div class="bar${last ? " acc" : ""}" style="width:${w.toFixed(1)}%"></div></div>` : ""}
        <div class="val">${esc(x.display != null ? x.display : x.value)}</div>
        <div class="lk">${drop > 0 ? `&minus;${drop}<small>lost here, ${pct}%</small>` : ""}</div>
      </div>`;
    }).join("");
    fig = exhibit(P.funnel.title, bars, P.funnel.note);
  }
  sheet({
    label: L.secGap, title: P.gap_title || L.tGap, intro: P.gap_intro, close: P.gap_close,
    body: `${/* The pattern, where a proposal built on a call puts the client.
                 Every line here is a finding about the category, never about the
                 reader, and the page says so in as many words. It is the only
                 honest way to write a first page for a company nobody has
                 spoken to yet, and the closing line asks them to correct it. */
        (P.pattern_groups && P.pattern_groups.length) || (P.pattern && P.pattern.length)
        ? `<div class="row"><div class="side">${L.theShape}</div><div class="main">
        <div class="cases">${(() => {
          const card = (x) => `<div class="case"><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p></div>`;
          if (P.pattern_groups && P.pattern_groups.length) {
            return P.pattern_groups.map(g =>
              (g.label ? `<div class="cgroup">${esc(g.label)}</div>` : "")
              + (g.items || []).map(card).join("")).join("");
          }
          return P.pattern.map(card).join("");
        })()}</div>
        ${P.pattern_note ? `<p class="small" style="margin-top:3.5mm">${esc(P.pattern_note)}</p>` : ""}
      </div></div>` : ""}${P.gap_points && P.gap_points.length ? `<div class="row"><div class="side">${L.inShort}</div><div class="main">
        <div class="big">${P.gap_points.map(g => `<div><span class="v">${esc(g.v)}</span><span class="k">${esc(g.k)}</span></div>`).join("")}</div>
      </div></div>` : ""}
      ${fig ? `<div class="row"><div class="side">${L.figure}</div><div class="main">${fig}</div></div>` : ""}`
  });
}

/* ---------------- 02 Why it happens ----------------
   The driver tree. Their goal at the top, the drivers that reach it
   underneath, the sub-drivers under each. The branches must not overlap
   and together must account for the whole goal, otherwise the reader
   finds the hole before we do. Everything here is a phrase, never a
   paragraph: the page is read as a diagram. */
if (P.tree && P.tree.branches && P.tree.branches.length) {
  /* Nodes are lettered A, A1, A2 so the levels are labelled, not inferred.
     Every box is a box and every line is drawn: root at the top, a spine
     across the drivers, a rail down each driver into its sub-drivers. */
  const branches = P.tree.branches.map((b, i) => {
    const letter = b.letter || String.fromCharCode(65 + i);
    return `<div class="branch">
      <div class="drv">
        <span class="dn">${esc(letter)}</span>
        <h3>${esc(b.title)}</h3>
        ${b.note ? `<p>${esc(b.note)}</p>` : ""}
      </div>
      <div class="subs">
        ${(b.subs || []).map((s, j) => `<div class="sub">
          <span class="sn">${esc(letter)}${j + 1}</span>
          <div><h4>${esc(s.title)}</h4>${s.note ? `<p>${esc(s.note)}</p>` : ""}</div>
        </div>`).join("")}
      </div>
    </div>`;
  }).join("");

  /* The stylesheet derives the spine and rail positions from the number of
     branches, so the only thing passed in is the count. */
  const n = P.tree.branches.length;

  const treeFig = exhibit(P.tree.title || L.tTree, `<div class="tree">
      <div class="goal">
        <span class="lbl">${esc(P.tree.goal_label || L.theGoal)}</span>
        <h3>${esc(P.tree.goal)}</h3>
        ${P.tree.goal_note ? `<p>${esc(P.tree.goal_note)}</p>` : ""}
      </div>
      <div class="branches" style="--n:${n}">${branches}</div>
    </div>`, P.tree.note);

  /* The tree runs the full width of the live area rather than sitting in
     the text column. It is the one page that is read as a drawing, and at
     column width the sub-drivers wrap to three words a line. */
  sheet({
    label: L.secWhy, title: P.tree_title || L.tWhy,
    intro: P.tree_intro, close: P.tree_close,
    body: treeFig
  });
}

/* ---------------- 03 What it costs ----------------
   The gap priced in the client's own money, in three layers: cash going
   out, growth not happening, and the load carried by the people. A layer
   with no figure is shown with none rather than guessed at. If the year
   number is not comfortably larger than the fee, the deal is not ready
   to be proposed. */
if (P.cost && P.cost.layers && P.cost.layers.length) {
  const c = P.cost;
  gapCur = c.local_currency || (P.roi && P.roi.local_currency) || "USD";
  const num = (v) => Math.round(v).toLocaleString("en-US");
  const monthly = c.layers.map(l => Number(l.monthly) || 0);
  const peak = Math.max(...monthly, 1);
  gapAnnual = monthly.reduce((a, b) => a + b, 0) * 12;

  /* What the whole engagement costs, in the same currency as the gap.
     Taken from the return page's inputs when they exist, otherwise stated
     directly here, so a deal with a hand-written return page still draws
     the fraction bar on the investment page. */
  if (Number(c.engagement_local)) {
    engagementLocal = Number(c.engagement_local);
  } else if (P.roi && P.roi.fee_usd) {
    engagementLocal = (Number(P.roi.fee_usd) + (Number(P.roi.ad_monthly_usd) || 0) * (Number(P.roi.months) || 3))
      * (Number(P.roi.usd_rate) || 1);
  }

  const rows = c.layers.map((l, i) => {
    const m = Number(l.monthly) || 0;
    const priced = m > 0;
    return `<div class="lay${priced ? "" : " nil"}">
      <div class="ln">${String(i + 1).padStart(2, "0")}</div>
      <div>
        <h3>${esc(l.name)}</h3>
        ${l.note ? `<p>${esc(l.note)}</p>` : ""}
        ${priced ? `<div class="track"><div class="bar" style="width:${(m / peak * 100).toFixed(1)}%"></div></div>` : ""}
      </div>
      <div class="amt">
        ${priced
          ? `<span class="m">${esc(gapCur)} ${num(m)}</span><small>a month</small>
             <span class="y">${esc(gapCur)} ${num(m * 12)}</span><small>a year</small>`
          : `<span class="m">${esc(l.instead || L.notCounted)}</span><small>${L.noFigure}</small>`}
      </div>
    </div>`;
  }).join("");

  sheet({
    label: L.secCost, title: c.title || L.tCost,
    intro: c.intro, close: c.close,
    body: `<div class="row"><div class="side">${L.layers}</div><div class="main">
        <div class="stack">${rows}</div>
        <div class="total"><span class="k">${esc(c.total_label || "What it costs you a year")}</span><span class="v">${esc(gapCur)} ${num(gapAnnual)}</span></div>
        ${c.note ? `<p class="small" style="margin-top:3mm">${esc(c.note)}</p>` : ""}
      </div></div>
      ${c.verdict ? `<div class="row"><div class="side">${L.thePoint}</div><div class="main">
        <div class="verdict"><span class="k">${esc(c.verdict_label || "Read it once")}</span><p>${c.verdict}</p></div>
      </div></div>` : ""}`
  });
}

/* ---------------- 03 The arithmetic ----------------
   The general variant's replacement for the cost page. When a call never
   produced the client's average project value or his margin, that page
   cannot be built out of anything but invention, so it is not built. What
   stands in its place is arithmetic performed entirely on our own fee: at
   each of several project values, how many signed projects cover the
   engagement. Every cell is derived, nothing is asserted about the client,
   and the reader finds his own row, which persuades better than being told
   which row is his. */
let arithInline = "";
if (P.arithmetic && ((P.arithmetic.project_values || []).length
                     || (P.arithmetic.mode === "threshold" && (P.arithmetic.margins || []).length)
                     || (P.arithmetic.mode === "margin" && Number(P.arithmetic.project_value))
                     || (P.arithmetic.mode === "volume" && Number(P.arithmetic.project_value_low)))) {
  const a = P.arithmetic;
  const cur = a.currency || (P.roi && P.roi.local_currency) || "USD";
  const months = Number(a.months) || (P.roi && Number(P.roi.months)) || 3;
  /* The engagement is stated once and every cell divides into it. Read from
     the roi block when it is not given directly, so this page and the
     investment page can never disagree about what is being asked for. */
  const total = Number(a.engagement_total) || (P.roi && P.roi.fee_usd
    ? (Number(P.roi.fee_usd) + (Number(P.roi.ad_monthly_usd) || 0) * months) * (Number(P.roi.usd_rate) || 1)
    : 0);
  const margins = (a.margins && a.margins.length ? a.margins : [10, 20]).map(Number);
  const num = (v) => Math.round(v).toLocaleString("en-US");

  const threshold = a.mode === "threshold";
  const marginMode = a.mode === "margin";
  const volumeMode = a.mode === "volume";
  let head, rows;

  if (volumeMode) {
    /* Four lines, and only the last one is arithmetic. A firm signing small
       tickets in volume is not deciding whether one job pays for us: it is
       deciding whether the rate we add pays for us, so that is the quantity
       the page states. The divisor is the bottom of their own range, which
       makes the answer the least flattering one their figures allow. */
    const lo = Number(a.project_value_low);
    const hi = Number(a.project_value_high) || lo;
    const need = lo > 0 ? total / lo : 0;
    head = "";
    rows = [
      [L.beWholeThing, esc(cur) + " " + num(total)],
      [L.beVolProject, esc(cur) + " " + num(lo) + (hi > lo ? " to " + num(hi) : "")],
      [L.beVolRate, esc(a.rate_display || "")],
      [L.beVolTarget, esc(a.target_display || "")],
      [L.beVolCovers, need.toFixed(1) + " " + (need <= 1 ? "of one project" : "projects")],
    ].filter(([, v]) => v !== "").map(([k, v], i, arr) =>
      `<tr class="${i === arr.length - 1 ? "under" : ""}"><td>${k}</td><td>${v}</td></tr>`).join("");
  } else if (marginMode) {
    /* Their project value, our fee, and the share of one job that covers it.
       Nothing here claims to know what they keep: it states the line and lets
       the reader work out which side of it he is on, which is the only way to
       use a figure a client will not say out loud. */
    const value = Number(a.project_value);
    const pct = value > 0 ? (total / value) * 100 : 0;
    head = "";
    rows = [
      [L.beYourProject, esc(cur) + " " + num(value)],
      [L.beWholeThing, esc(cur) + " " + num(total)],
      [L.beCoversIf, pct.toFixed(1) + "%"],
    ].map(([k, v], i) => `<tr class="${i === 2 ? "under" : ""}"><td>${k}</td><td>${v}</td></tr>`).join("");
  } else if (threshold) {
    /* One question, one answer, in money. The reader finds his margin and
       reads across once. Nothing here is a count of his projects and nothing
       is a share of them, which is what the two-column shape kept implying. */
    head = `<tr><th>${L.beIfMargin}</th><th>${L.beOneJob}</th></tr>`;
    rows = margins.map(m => `<tr><td>${m}%</td><td>${esc(cur)} ${num(total / (m / 100))}</td></tr>`).join("");
  } else {
    head = `<tr><th>${L.beProject}</th>${margins.map(m =>
      `<th>${L.beAtNet}${m}${L.beNet}</th>`).join("")}</tr>`;
    rows = a.project_values.map(v => {
      const cells = margins.map(m => {
        const profit = Number(v) * m / 100;
        return profit > 0 ? total / profit : 0;
      });
      /* A row where even the tighter margin needs less than one project is
         the whole argument of the page, and is marked so the eye lands on it
         first. A row needing more than one is left plain and left in: a table
         where every answer flatters us is not evidence. */
      const under = cells.every(c => c > 0 && c < 1);
      return `<tr class="${under ? "under" : ""}"><td>${esc(cur)} ${num(v)}</td>${
        cells.map(c => `<td>${c.toFixed(1)}</td>`).join("")}</tr>`;
    }).join("");
  }

  const table = `<div class="row"><div class="side">${L.theSums}</div><div class="main">
        ${exhibit(a.table_title || (volumeMode ? L.beVolTable : marginMode ? L.beMarginTable : threshold ? L.beThreshold : L.beTable),
          `<table class="betab">${head ? `<thead>${head}</thead>` : ""}<tbody>${rows}</tbody></table>`, a.note)}
      </div></div>`;
  const verdict = a.verdict ? `<div class="row"><div class="side">${L.thePoint}</div><div class="main">
        <div class="verdict"><span class="k">${esc(a.verdict_label || "Read it once")}</span><p>${a.verdict}</p></div>
      </div></div>` : "";

  /* inline: true folds the table into the investment page instead of giving
     it a sheet. A four-page document has no page to spare, and the table is
     the argument for the price, so it belongs beside it anyway. */
  if (a.inline) {
    arithInline = table + verdict;
  } else {
    sheet({
      label: L.secArith, title: a.title || L.tArith, intro: a.intro, close: a.close,
      body: table.replace("</div></div>",
              `<div class="total"><span class="k">${esc(a.total_label || L.total)}</span><span class="v">${esc(cur)} ${num(total)}</span></div>
      </div></div>`) + verdict
    });
  }
}

/* ---------------- The problem, in prose ----------------
   Kept for deals where a cause needs more than a phrase. Most proposals
   carry the driver tree instead and leave this block out of the data. */
if (P.problems && P.problems.length) {
  sheet({
    label: L.secProblem, title: P.problems_title || L.tProblem, intro: P.problems_intro, close: P.problems_close,
    body: `<div class="row"><div class="side">${L.causes}</div><div class="main"><div class="cases">
      ${P.problems.map(x => `<div class="case"><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p></div>`).join("")}
    </div></div></div>`
  });
}

/* Evidence goes next to the price on a full proposal, because that is where
   a reader weighs it. On a short one there is no room, and it reads just as
   well beside the thing it is evidence for. proof_on picks the page. */
const proofOn = P.proof_on === "solution" ? "solution" : "investment";
const proofBlock = P.proof && P.proof.length
  ? `<div class="row"><div class="side">${L.doneBefore}</div><div class="main">
        <div class="proof">${P.proof.map(p => `<div>
          <span class="v">${esc(p.v)}</span>
          <p>${esc(p.k)}</p>
          ${p.src ? `<span class="src">${esc(p.src)}</span>` : ""}
        </div>`).join("")}</div>
      </div></div>`
  : "";

/* ---------------- 03 The solution ---------------- */
if (P.solution && P.solution.length) {
  sheet({
    label: L.secSolution, title: P.solution_title || L.tSolution, intro: P.solution_intro, close: P.solution_close,
    body: `${P.program && P.program.length ? `<div class="row"><div class="side">${L.theSystem}</div><div class="main">
        <div class="chain">${P.program.map((s, i) => `<div class="node">
          <span class="cn">${String(i + 1).padStart(2, "0")}</span>
          <h4>${esc(s.title)}</h4>
          ${s.note ? `<p>${esc(s.note)}</p>` : ""}
        </div>`).join("")}</div>
      </div></div>` : ""}
      <div class="map">
        ${P.solution.map(x => `<div class="m">
          <div class="lhs"><h3>${esc(x.problem)}</h3><p>${esc(x.detail)}</p></div>
          <div class="rhs"><p>${esc(x.fix)}</p></div>
        </div>`).join("")}
      </div>
      ${P.solution_targets && P.solution_targets.length ? `<div class="row"><div class="side">${L.target}</div><div class="main">
        <div class="big accent">${P.solution_targets.map(t => `<div><span class="v">${esc(t.v)}</span><span class="k">${esc(t.k)}</span></div>`).join("")}</div>
      </div></div>` : ""}
      ${proofOn === "solution" ? proofBlock : ""}
      ${P.media ? `<div class="row"><div class="side">${L.seeIt}</div><div class="main">
        <div class="media">
          <div class="qr${P.media.image ? "" : " empty"}">${P.media.image
            ? `<img src="${esc(P.media.image)}" alt="">`
            : esc(L.scanIt).replace(/\n/g, "<br>")}</div>
          <div>
            <h4>${esc(P.media.title || "")}</h4>
            <p>${esc(P.media.body || "")}</p>
            ${P.media.url ? `<span class="url">${esc(P.media.url)}</span>` : ""}
          </div>
        </div>
      </div></div>` : ""}`
  });
}

/* ---------------- 04 Investment and return ----------------
   Price and payback on one page. The break-even maths is computed, not
   typed: the closer enters six numbers in `roi` and the page works out
   how many extra projects the whole thing has to produce before it has
   paid for itself, at the client's worst margin and our highest ad spend.
   If the case only works on optimistic numbers, do not send it. */
/* Computed values stay in local variables and never get written back onto
   the data. A figure the renderer overwrites on every redraw must not
   appear in the editor panel, where changing it would look like an edit
   and do nothing, nor in Download JSON, where it would harden into the
   deal's file. Anything the data file states wins over the calculation. */
let breakevenRows = (P.roi_breakeven && P.roi_breakeven.length) ? P.roi_breakeven : null;

if (P.roi && P.roi.fee_usd && Number(P.roi.avg_project_value) > 0) {
  const r = P.roi;
  const rate = Number(r.usd_rate) || 1;
  const months = Number(r.months) || 3;

      { v: perMonth.toFixed(1), k: L.bePerMonth },
      { v: r.target_projects_month || "2 to 4", k: L.beTarget }
    ];
  }

/* ---- Overflow guard: flag any page taller than A4 ----
   Measure against the A4 constant, never against the sheet's own box: on
   screen the sheet has min-height and no fixed height, so it GROWS to fit and
   scrollHeight can never exceed clientHeight. In print it is clipped to 296mm
   instead, and whatever grew past that is silently cut.

   faces set to font-display: swap, so the first measurement happens in
   fallback metrics — pages that swell when the real faces arrive were passing
   this check and being clipped in the PDF. On one live draft that hid two
   overflowing pages out of three. */
function overflowGuard() {
  const A4 = 297 / 25.4 * 96; /* mm to css px */
  document.querySelectorAll(".sheet").forEach(s => {
    s.classList.toggle("over", s.getBoundingClientRect().height > A4 + 2);

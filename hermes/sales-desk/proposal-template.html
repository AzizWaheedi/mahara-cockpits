    const pick = document.createElement("div");
    pick.className = "pick";

    const thumb = document.createElement(obj[key] ? "img" : "div");
    thumb.className = obj[key] ? "thumb" : "thumb empty";
    if (obj[key]) thumb.src = obj[key]; else thumb.textContent = "none";

    const file = document.createElement("input");
    file.type = "file";
    file.accept = "image/*";
    file.addEventListener("change", () => {
      const fl = file.files && file.files[0];
      if (!fl) return;
      const reader = new FileReader();
      reader.onload = () => { obj[key] = reader.result; build(); redraw(); };
      reader.readAsDataURL(fl);
    });

    const clear = document.createElement("button");
    clear.className = "mini";
    clear.textContent = "Clear";
    clear.onclick = () => { obj[key] = null; build(); redraw(); };

    pick.appendChild(thumb);
    pick.appendChild(file);
    if (obj[key]) pick.appendChild(clear);
    wrap.appendChild(lab);
    wrap.appendChild(pick);
    return wrap;
  }

  function fieldFor(obj, key, label, depth) {
    depth = depth || 0;
    const v = obj[key];
    if (IMAGE_KEYS.indexOf(key) >= 0) return imageField(obj, key, label);
    if (Array.isArray(v)) return arrayField(obj, key, label, depth);
    if (v && typeof v === "object") return objectField(obj, key, label, depth);
    return scalar(obj, key, label);
  }

  /* Keys beginning with an underscore are notes to whoever fills the file,
     not content. They stay out of the panel. */
  const internal = (k) => k.charAt(0) === "_";

  const claimed = {};
  SCHEMA.forEach(s => s.fields.forEach(x => { claimed[x.k] = true; }));

  /* ---- Finding things --------------------------------------------------- */

  let query = "";
  const hay = (section, spec) =>
    (spec.label + " " + spec.k + " " + spec.find + " " + section.label).toLowerCase();
  const matches = (section, spec) => !query || hay(section, spec).indexOf(query) >= 0;

  findBox.addEventListener("input", () => {
    query = findBox.value.trim().toLowerCase();
    build();
  });
  panel.querySelector(".find .clr").onclick = () => {
    findBox.value = ""; query = ""; build(); findBox.focus();
  };

  /* Scroll the document to a sheet and mark it, so "which part is this?" is
     answered by looking rather than by counting. */
  const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let flashTimer = null;
  let spyHandler = null;
  function showSheet(index) {
    const sheets = document.querySelectorAll(".sheet");
    const el = sheets[index];
    if (!el) return;
    el.scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "start" });
    clearTimeout(flashTimer);
    sheets.forEach(s => s.classList.remove("flash"));
    el.classList.add("flash");
    flashTimer = setTimeout(() => el.classList.remove("flash"), 1400);
  }

  function goToGroup(label) {
    const grp = body.querySelector('[data-grp="' + label + '"]');
    if (!grp) return;
    grp.scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "start" });
    const first = grp.querySelector("input, textarea");
    if (first) first.focus({ preventScroll: true });
  }

  /* The way in from the document. Hover a sheet, press the button, and the
     panel opens on that page's fields - no field name to know. */
  function markSheets() {
    const live = SCHEMA.filter(s => !s.off && s.has());
    document.querySelectorAll(".sheet").forEach((el, i) => {
      const old = el.querySelector(".edit-here");
      if (old) old.remove();
      const section = live[i];
      if (!section) return;
      const b = document.createElement("button");
      b.className = "edit-here";
      b.type = "button";
      b.textContent = "Edit this page";
      b.onclick = (e) => {
        e.stopPropagation();
        if (query) { findBox.value = ""; query = ""; }
        openPanel();
        goToGroup(section.label);
      };
      el.appendChild(b);
    });
  }

  /* ---- The panel -------------------------------------------------------- */

  function build() {
    body.innerHTML = "";

    const live = SCHEMA.filter(s => !s.off && s.has());
    nav.innerHTML = "";
    live.forEach((s, i) => {
      const b = document.createElement("button");
      b.innerHTML = '<i>' + (i + 1) + '</i>' + esc(s.label);
      b.onclick = () => { goToGroup(s.label); showSheet(i); };
      nav.appendChild(b);
    });

    /* Scroll-spy. The chip for the page you are looking at stays lit, so the
       panel keeps answering "where am I" while you scroll the document rather
       than only when you click. Queried fresh each time because renderDoc()
       replaces every sheet on each keystroke. */
    const chips = [].slice.call(nav.children);
    const spy = () => {
      const sheets = document.querySelectorAll(".sheet");
      let best = 0, most = -Infinity;
      for (let i = 0; i < sheets.length; i++) {
        const r = sheets[i].getBoundingClientRect();
        const visible = Math.min(r.bottom, window.innerHeight) - Math.max(r.top, 0);
        if (visible > most) { most = visible; best = i; }
      }
      chips.forEach((c, i) => c.classList.toggle("here", i === best));
    };
    if (spyHandler) window.removeEventListener("scroll", spyHandler);
    let ticking = false;
    spyHandler = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => { spy(); ticking = false; });
    };
    window.addEventListener("scroll", spyHandler, { passive: true });
    spy();

    let shown = 0;

    SCHEMA.forEach(section => {
      const present = !section.off && section.has();
      /* A block that prints inside another section's sheet is not OFF, and
         saying so sends a closer looking for a page he is already reading. */
      const host = !present && section.onPageOf ? section.onPageOf() : null;
      const hostNo = host
        ? live.reduce((n, x, i) => x.label === host ? i + 1 : n, null) : null;
      const pageNo = present ? live.indexOf(section) + 1 : hostNo;
      const hits = section.fields.filter(x => matches(section, x));
      if (!hits.length) return;

      const here = hits.filter(x => x.k in P && P[x.k] != null && !internal(x.k));
      const gone = hits.filter(x => !(x.k in P) || P[x.k] == null);
      shown += hits.length;

      const grp = document.createElement("section");
      grp.className = "grp" + (present || section.off || hostNo ? "" : " off");
      grp.dataset.grp = section.label;

      const h = document.createElement("h5");
      const tag = section.off ? "SET"
        : (present ? "PAGE " + pageNo
          : (hostNo ? "ON PAGE " + hostNo : "OFF"));
      h.innerHTML = '<span class="pg">' + tag + '</span>' + esc(section.label);
      if (pageNo) {
        const go = document.createElement("button");
        go.className = "go";
        go.textContent = "Show page";
        go.onclick = () => showSheet(pageNo - 1);
        h.appendChild(go);
      }
      grp.appendChild(h);

      if (section.note && !query) {
        const n = document.createElement("div");
        n.className = "grp-note";
        n.textContent = section.note;
        grp.appendChild(n);
      }

      here.forEach(x => {
        const el = fieldFor(P, x.k, x.label, 0);
        el.dataset.k = x.k;
        grp.appendChild(el);
      });

      /* Everything this page can carry that the file has not got. Not a
         hand-kept "optional" list beside the real one - the difference
         between the two, computed, so it can never fall behind. */
      if (gone.length) {
        const m = document.createElement("div");
        m.className = "miss";
        const cap = document.createElement("div");
        cap.className = "cap";
        cap.textContent = here.length ? "Not in this proposal yet" : "This page is empty. Add:";
        m.appendChild(cap);
        const chipRow = document.createElement("div");
        chipRow.className = "chips";
        gone.forEach(x => {
          const b = document.createElement("button");
          b.className = "add";
          b.textContent = "Add " + x.label.toLowerCase();
          b.onclick = () => {
            P[x.k] = JSON.parse(JSON.stringify(x.blank));
            build(); draw();
            const el = body.querySelector('[data-k="' + x.k + '"]');
            if (el) {
              el.classList.add("hit");
              el.scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "center" });
              const first = el.querySelector("input, textarea");
              if (first) first.focus({ preventScroll: true });
            }
          };
          chipRow.appendChild(b);
        });
        m.appendChild(chipRow);
        grp.appendChild(m);
      }
      body.appendChild(grp);
    });

    /* Whatever the map does not know about. A deal file can carry keys this
       template was never told about, and they still have to be reachable. */
    const rest = Object.keys(P).filter(k =>
      !internal(k) && !claimed[k] &&
      (!query || (k + " anything else").toLowerCase().indexOf(query) >= 0));
    if (rest.length) {
      shown += rest.length;
      const grp = document.createElement("section");
      grp.className = "grp";
      grp.dataset.grp = "Anything else";
      grp.innerHTML = '<h5><span class="pg">EXTRA</span>Anything else</h5>';
      rest.forEach(k => grp.appendChild(fieldFor(P, k, null, 0)));
      body.appendChild(grp);
    }

    if (query && !shown) {
      const none = document.createElement("div");
      none.className = "nores";
      none.textContent = 'Nothing matches "' + findBox.value + '". '
        + "Try a word from the page itself, or clear the search to see every field.";
      body.appendChild(none);
      return;
    }

    if (query) return;

    /* The blank and a live deal are used differently, and confusing the two
       is how one client ends up reading another client's figures. Each file
       says which one it is. */
    const print = "In the print window set <b>Destination: Save as PDF</b>, " +
      "<b>Margins: None</b>, and tick <b>Background graphics</b>.";
    const note = document.createElement("div");
    note.className = "steps-note";
    note.innerHTML = P._starter
      ? "<b>This is the blank</b><br>" +
        "1. Copy the file and name the copy after the client.<br>" +
        "2. Fill every field marked FILL. The document updates as you type.<br>" +
        "3. Click <b>Save as PDF</b>. " + print + "<br>" +
        "4. Send the client the PDF, never the file. Keep this blank for the next deal."
      : "<b>This is " + esc(P.client_company) + "'s proposal</b><br>" +
        "1. Edit the fields above, or hover any page and press <b>Edit this page</b>. " +
        "The document updates as you type.<br>" +
        "2. Click <b>Save as PDF</b>. " + print + "<br>" +
        "3. Send the client the PDF, never this file.<br>" +
        "Do not reuse this file for another client. Their figures are written into " +
        "the sentences, not only into the fields. Start the next deal from the blank.";
    body.appendChild(note);
  }

  panel.querySelector("header").addEventListener("click", (e) => {
    const a = e.target.dataset ? e.target.dataset.a : null;
    if (!a) return;
    if (a === "close") {
      panel.classList.remove("on");
      document.body.classList.remove("ed-on");
      return;
    }
    if (a === "pdf") {
      panel.classList.remove("on");
      document.body.classList.remove("ed-on");
      setTimeout(() => window.print(), 150);
      return;
    }
    const json = JSON.stringify(P, null, 2);
    if (a === "copy") {
      navigator.clipboard.writeText(json).then(() => {
        e.target.textContent = "Copied";
        setTimeout(() => { e.target.textContent = "Copy"; }, 1200);
      });
      return;
    }
    if (a === "save") {
      const name = String(P.reference || P.client_company || "proposal").toLowerCase().replace(/[^a-z0-9]+/g, "-");
      const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
      const link = document.createElement("a");
      link.href = url;
      link.download = name + ".json";
      link.click();
      URL.revokeObjectURL(url);
    }
  });

  function openPanel() {
    build();
    panel.classList.add("on");
    document.body.classList.add("ed-on");
  }

  openBtn.onclick = openPanel;
  markSheets();

  if (location.search.indexOf("edit") >= 0) openPanel();
})();
</script>
</body>
</html>

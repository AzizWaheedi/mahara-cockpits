<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#091333">
<title>مكالمتك · Mahara Media</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Geist+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<link rel="stylesheet" href="/call.css">
<script src="/core.js" defer></script>
<script src="/call.js" defer></script>
</head>
<!-- Where /go sends a link whose room is over: /ended?c={code}. The script asks sales-live/open/{code} for the official WhatsApp number; nothing is read from the address but the code. -->
<body data-page="ended" data-state="ended">
<main class="page">
  <img class="brand" src="/logo.png" alt="Mahara Media" width="720" height="192">

  <section class="stage" aria-live="polite">
    <div class="ring" aria-hidden="true">
      <svg viewBox="0 0 140 140" focusable="false">
        <defs>
          <linearGradient id="mahara-gradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2E5BD6"/>
            <stop offset="0.65" stop-color="#00CFC8"/>
            <stop offset="1" stop-color="#00CFC8"/>
          </linearGradient>
        </defs>
        <circle class="track" cx="70" cy="70" r="62"/>
        <circle class="arc" cx="70" cy="70" r="62"/>
      </svg>
      <div class="initial"><img src="/mark.png" alt="" width="58" height="58"></div>
    </div>

    <div class="lines">
      <p class="l1" lang="ar" dir="rtl">هالمكالمة خلصت. رد على آخر رسالة منا ونرتب لك وقت ثاني.</p>
      <p class="l2" lang="en" dir="ltr">This call has ended. Reply to our last message and we will find a new time.</p>
    </div>

    <div class="hint" hidden>
      <p class="h1"></p>
      <p class="h2"></p>
    </div>

    <div class="actions"></div>
  </section>

  <footer class="code" hidden><span class="c1"></span><span class="c2"></span><b></b></footer>
</main>
</body>
</html>
